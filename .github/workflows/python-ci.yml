name: python-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 — repo policy requires SHA pinning
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — repo policy requires SHA pinning
        with:
          python-version-file: .python-version
      - name: Show interpreter
        run: python -VV
      - name: Unit tests
        run: python -B -m unittest discover -t . -s tests
