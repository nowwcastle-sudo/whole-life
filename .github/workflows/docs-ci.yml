name: docs-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 — repo policy requires SHA pinning
      - name: Verify approved baseline hashes
        run: bash scripts/check-approved-baseline.sh
      - name: Check relative Markdown links
        run: bash scripts/check-markdown-links.sh
